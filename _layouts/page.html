---
layout: default
---
<article class="page">
  {%- if page.title -%}
  <header class="page-header">
    <h1 class="page-title">// {{ page.title }}</h1>
    {%- if page.subtitle -%}<p class="page-sub">{{ page.subtitle }}</p>{%- endif -%}
  </header>
  {%- endif -%}

  <div class="post-content">
    {{ content }}
  </div>
</article>
