---
layout: page
---
<header class="page-header">
  <p class="prompt">~/tags $ grep -l '<span class="prompt-arg">#{{ page.title }}</span>' _posts/*</p>
  <h1 class="page-title">// #{{ page.title }}</h1>
  <p class="page-sub">{{ page.posts.size }} post{% if page.posts.size != 1 %}s{% endif %} tagged.</p>
</header>

<section class="post-list">
  {%- for post in page.posts -%}
    {%- include post-card.html post=post -%}
  {%- endfor -%}
</section>
