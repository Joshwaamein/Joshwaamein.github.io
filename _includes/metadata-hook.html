<!-- Matrix Digital Rain Animation -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  var canvas = document.createElement('canvas');
  canvas.id = 'matrix-rain';
  document.body.prepend(canvas);

  var ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  var chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  chars = chars.split('');

  var fontSize = 14;
  var columns = Math.floor(canvas.width / fontSize);
  var drops = [];

  for (var i = 0; i < columns; i++) {
    drops[i] = Math.floor(Math.random() * -80);
  }

  function draw() {
    ctx.fillStyle = 'rgba(10, 10, 10, 0.048)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.font = fontSize + 'px monospace';

    for (var i = 0; i < drops.length; i++) {
      var text = chars[Math.floor(Math.random() * chars.length)];

      var brightness = Math.random();
      if (brightness > 0.96) {
        ctx.fillStyle = '#39ff14';
      } else if (brightness > 0.7) {
        ctx.fillStyle = '#00ff41';
      } else {
        ctx.fillStyle = '#008f11';
      }

      ctx.fillText(text, i * fontSize, drops[i] * fontSize);

      if (drops[i] * fontSize > canvas.height && Math.random() > 0.98) {
        drops[i] = 0;
      }
      drops[i]++;
    }
  }

  setInterval(draw, 60);
});
</script>
