{%- if paginator and paginator.total_pages > 1 -%}
<nav class="pagination" aria-label="Pagination">
  {%- if paginator.previous_page -%}
    <a class="page-link prev" href="{{ paginator.previous_page_path | relative_url }}">← Newer</a>
  {%- else -%}
    <span class="page-link disabled">← Newer</span>
  {%- endif -%}

  <span class="page-indicator">Page {{ paginator.page }} / {{ paginator.total_pages }}</span>

  {%- if paginator.next_page -%}
    <a class="page-link next" href="{{ paginator.next_page_path | relative_url }}">Older →</a>
  {%- else -%}
    <span class="page-link disabled">Older →</span>
  {%- endif -%}
</nav>
{%- endif -%}
